plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.deviceguard'
version = '0.1.0'

android {
  namespace "expo.modules.deviceguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // BootReceiver -> HeadlessJsTaskService lives in React Native. Local Expo
  // modules only get expo-modules-core as compileOnly, so add RN explicitly.
  implementation 'com.facebook.react:react-android'
}
